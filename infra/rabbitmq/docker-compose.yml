version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: adeo_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:

networks:
  default:
    name: adeo_network
    external: true
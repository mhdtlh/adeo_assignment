version: '3.8'
services:
  agent:
    build: 
      context: ../../
      dockerfile: services/agent/Dockerfile
    container_name: adeo_agent
    volumes:
      - ../../services/agent:/app/services/agent
      - ../../services/shared_utils:/app/services/shared_utils
      - ../../query_engine.py:/app/query_engine.py
      - ./hf_cache:/app/hf_cache
    env_file:
      - ../../.env
    environment:
      - RABBITMQ_HOST=adeo_rabbitmq
      - CHROMA_HOST=adeo_chromadb
      - NEO4J_URL=bolt://adeo_neo4j:7687

networks:
  default:
    name: adeo_network
    external: true